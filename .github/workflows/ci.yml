name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-library:
    name: Build Library
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Build Debug
        run: |
          xcodebuild build \
            -scheme Scyther \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      # `--triple` rather than `-Xswiftc -target`: the target has to reach clang as well, which
      # compiles the Objective-C `ScytherBootstrap` target against the same SDK.
      - name: Build Release
        run: |
          swift build -c release \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            --triple arm64-apple-ios16.0-simulator

  test:
    name: Run Tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Catalog generator tests
        run: |
          python3 -m unittest Scripts/localization/test_build_catalog.py -v
          python3 Scripts/localization/build_catalog.py && git diff --exit-code Sources/Scyther/Resources/Localizable.xcstrings

      - name: Run Tests
        run: |
          xcodebuild test \
            -scheme Scyther \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17 Pro' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  build-example-app:
    name: Build Example App
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Build Example App
        run: |
          xcodebuild build \
            -project Example/ScytherExample.xcodeproj \
            -scheme ScytherExample \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
